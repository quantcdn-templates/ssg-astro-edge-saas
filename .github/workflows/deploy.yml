name: Verify and deploy to QuantCDN
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_CONFIGURED: ${{ github.event_name != 'pull_request' && vars.QUANT_CUSTOMER != '' && vars.QUANT_PROJECT != '' && secrets.QUANT_TOKEN != '' && !contains(github.event.head_commit.message, '[skip deploy]') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Deployment setup
        if: env.DEPLOY_CONFIGURED != 'true'
        run: echo 'Build verified. Deployment requires QUANT_CUSTOMER and QUANT_PROJECT variables and a QUANT_TOKEN secret; pull requests and [skip deploy] commits only verify the build.' >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare the Quant 404 route
        if: env.DEPLOY_CONFIGURED == 'true'
        run: |
          mkdir -p dist/_quant404
          cp dist/404.html dist/_quant404/index.html
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        if: env.DEPLOY_CONFIGURED == 'true'
        with:
          path: .quant-revision
          key: quant-revision-${{ github.ref }}-${{ github.run_id }}
          restore-keys: quant-revision-${{ github.ref }}-
      - uses: quantcdn/deploy-action@9bf8cae8497ab6628d4b248db9eb11464f37e1e5 # v7.0.1
        if: env.DEPLOY_CONFIGURED == 'true'
        with:
          customer: ${{ vars.QUANT_CUSTOMER }}
          project: ${{ vars.QUANT_PROJECT }}
          token: ${{ secrets.QUANT_TOKEN }}
          dir: dist
          functions: quant/edge-functions.json
          revision-log: .quant-revision
          # Managed rules (quant/edge-rules.json) deploy only when the portal injected the
          # separate project-scoped rules token; a manual setup without it is unchanged.
          rules: ${{ secrets.QUANT_API_TOKEN != '' && vars.QUANT_BASE_URL != '' && 'quant/edge-rules.json' || '' }}
          api-token: ${{ secrets.QUANT_API_TOKEN }}
          api-base-url: ${{ vars.QUANT_BASE_URL }}
      - uses: quantcdn/purge-action@9bab37759d3cd137b5982706b20aad785a13b229 # v6.0.1
        if: env.DEPLOY_CONFIGURED == 'true'
        with:
          customer: ${{ vars.QUANT_CUSTOMER }}
          project: ${{ vars.QUANT_PROJECT }}
          token: ${{ secrets.QUANT_TOKEN }}
          url_pattern: "/*"
